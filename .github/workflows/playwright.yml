name: Playwright E2E Tests

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_NURSE_EMAIL: ${{ secrets.PLAYWRIGHT_NURSE_EMAIL }}
      PLAYWRIGHT_NURSE_PASSWORD: ${{ secrets.PLAYWRIGHT_NURSE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Wait for Railway to deploy this branch and get the preview URL ──────
      # Railway creates a GitHub Deployment for every push. We poll the GitHub
      # Deployments API until we find one in "success" state for this commit,
      # then extract its environment URL to use as the Playwright base URL.
      - name: Wait for Railway deployment and get preview URL
        id: railway_url
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            console.log(`Waiting for Railway deployment for commit: ${sha}`);

            // Poll for up to 10 minutes (120 attempts × 5s = 600s)
            for (let i = 0; i < 120; i++) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner, repo,
                sha,
                per_page: 10,
              });

              for (const deployment of deployments) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner, repo,
                  deployment_id: deployment.id,
                  per_page: 5,
                });

                const success = statuses.find(s => s.state === 'success' && s.environment_url);
                if (success) {
                  console.log(`Railway deployed to: ${success.environment_url}`);
                  core.setOutput('url', success.environment_url);
                  return;
                }
              }

              console.log(`Attempt ${i + 1}/120 — deployment not ready yet, waiting 5s...`);
              await new Promise(r => setTimeout(r, 5000));
            }

            // Fallback to fixed staging URL if no Railway deployment found
            console.log('No Railway deployment found — falling back to fixed staging URL');
            core.setOutput('url', 'https://mcm-testing.up.railway.app');

      - name: Run all E2E tests
        run: npx playwright test e2e/admin-user-create-login.spec.ts e2e/nurse-flowboard-add-patient.spec.ts e2e/nurse-flowboard-add-encounter.spec.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: ${{ steps.railway_url.outputs.url }}

      - name: Upload screenshots, videos, traces and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
