name: Playwright E2E Tests

on:
  push:
    branches:
      - testing
  pull_request:
    branches:
      - testing

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_NURSE_EMAIL: ${{ secrets.PLAYWRIGHT_NURSE_EMAIL }}
      PLAYWRIGHT_NURSE_PASSWORD: ${{ secrets.PLAYWRIGHT_NURSE_PASSWORD }}
      PLAYWRIGHT_DOCTOR_EMAIL: ${{ secrets.PLAYWRIGHT_DOCTOR_EMAIL }}
      PLAYWRIGHT_DOCTOR_PASSWORD: ${{ secrets.PLAYWRIGHT_DOCTOR_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # ── Wait for Railway to finish deploying before running tests ───────────
      # Polls Railway API every 10s until deployment succeeds or fails.
      # This ensures Playwright always tests the freshly deployed code.
      - name: Wait for Railway deployment to complete
        run: |
          echo "Waiting for Railway to finish deploying..."
          for i in $(seq 1 60); do
            RESPONSE=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
              -H "Authorization: Bearer ${{ secrets.RAILWAY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d '{"query":"query{service(id:\"${{ secrets.RAILWAY_SERVICE_ID }}\"){deployments(first:1){edges{node{status}}}}}"}')

            STATUS=$(echo $RESPONSE | node -e "
              let d='';
              process.stdin.on('data',c=>d+=c);
              process.stdin.on('end',()=>{
                try{ console.log(JSON.parse(d)?.data?.service?.deployments?.edges?.[0]?.node?.status||''); }
                catch(e){ console.log(''); }
              });
            ")

            echo "Attempt $i/60 — Railway status: $STATUS"

            if [ "$STATUS" = "SUCCESS" ]; then
              echo "Railway deployment succeeded — starting tests"
              break
            fi

            if [ "$STATUS" = "FAILED" ]; then
              echo "Railway deployment FAILED — running tests against current live URL anyway"
              break
            fi

            sleep 10
          done

      - name: Run all E2E tests
        run: npx playwright test e2e/auth.spec.ts e2e/security-permissions.spec.ts e2e/global-ui.spec.ts e2e/admin-user-create-login.spec.ts e2e/admin-locations.spec.ts e2e/admin-pharmacies.spec.ts e2e/admin-flowboard.spec.ts e2e/profile.spec.ts e2e/nurse-flowboard-add-patient.spec.ts e2e/nurse-flowboard-add-encounter.spec.ts e2e/nurse-vitals.spec.ts e2e/doctor-encounter-modal.spec.ts e2e/doctor-soap.spec.ts e2e/doctor-prescriptions.spec.ts e2e/encounter-lifecycle.spec.ts e2e/i693.spec.ts e2e/compliance.spec.ts e2e/support.spec.ts
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: https://mcm-development.up.railway.app

      - name: Upload screenshots, videos, traces and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30