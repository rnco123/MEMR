name: Playwright E2E Tests

on:
  push:
    branches:
      - qa
  pull_request:
    branches:
      - qa

jobs:
  playwright:
    name: Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PLAYWRIGHT_BASE_URL: https://mcm-testing.up.railway.app
      PLAYWRIGHT_ADMIN_EMAIL: ${{ secrets.PLAYWRIGHT_ADMIN_EMAIL }}
      PLAYWRIGHT_ADMIN_PASSWORD: ${{ secrets.PLAYWRIGHT_ADMIN_PASSWORD }}
      PLAYWRIGHT_NURSE_EMAIL: ${{ secrets.PLAYWRIGHT_NURSE_EMAIL }}
      PLAYWRIGHT_NURSE_PASSWORD: ${{ secrets.PLAYWRIGHT_NURSE_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run admin user creation test
        run: npx playwright test e2e/admin-user-create-login.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Run nurse flowboard add patient test
        run: npx playwright test e2e/nurse-flowboard-add-patient.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Run nurse flowboard add encounter test
        run: npx playwright test e2e/nurse-flowboard-add-encounter.spec.ts
        continue-on-error: true
        env:
          CI: true

      - name: Upload screenshots, videos, traces and HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_number }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
