<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2E6EF3" />
    <title>Offline — MyclinicMD</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        min-height: 100dvh;
        background: linear-gradient(165deg, #bfdbfe 0%, #eef2ff 45%, #f8fafc 100%);
        color: #0f172a;
        -webkit-font-smoothing: antialiased;
      }

      .page {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: max(1rem, env(safe-area-inset-top)) 1.25rem max(1.5rem, env(safe-area-inset-bottom));
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 0 1.5rem;
      }

      .brand-mark {
        width: 2rem;
        height: 2rem;
        border-radius: 0.625rem;
        background: #2e6ef3;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-mark svg {
        width: 1.125rem;
        height: 1.125rem;
        color: #fff;
      }

      .brand-name {
        font-size: 0.9375rem;
        font-weight: 700;
        color: #1e293b;
        letter-spacing: -0.02em;
      }

      .card {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        max-width: 22rem;
        width: 100%;
        margin: 0 auto;
        text-align: center;
      }

      .sheet {
        width: 100%;
        background: #fff;
        border-radius: 1.75rem;
        padding: 2rem 1.5rem 1.75rem;
        box-shadow: 0 20px 50px rgba(15, 23, 42, 0.1);
      }

      .icon-wrap {
        width: 4.5rem;
        height: 4.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1.25rem;
        background: linear-gradient(135deg, #eff6ff 0%, #dbeafe 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .icon-wrap svg {
        width: 2rem;
        height: 2rem;
        color: #2e6ef3;
      }

      .icon-wrap::after {
        content: '';
        position: absolute;
        width: 2.75rem;
        height: 2px;
        background: #ef4444;
        border-radius: 1px;
        transform: rotate(-45deg);
        box-shadow: 0 0 0 2px #fff;
      }

      h1 {
        font-size: 1.375rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: #0f172a;
        margin-bottom: 0.5rem;
      }

      .desc {
        font-size: 0.875rem;
        line-height: 1.55;
        color: #64748b;
        margin-bottom: 1.5rem;
      }

      .tips {
        list-style: none;
        text-align: left;
        margin-bottom: 1.5rem;
        padding: 0.875rem 1rem;
        background: #f8fafc;
        border-radius: 0.875rem;
        border: 1px solid #e2e8f0;
      }

      .tips li {
        display: flex;
        align-items: flex-start;
        gap: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: #475569;
      }

      .tips li + li {
        margin-top: 0.5rem;
      }

      .tips li::before {
        content: '•';
        color: #2e6ef3;
        font-weight: 700;
        flex-shrink: 0;
      }

      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 3rem;
        padding: 0 1.25rem;
        border: none;
        border-radius: 9999px;
        background: #2e6ef3;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(46, 110, 243, 0.35);
        text-decoration: none;
        transition: background 0.15s ease;
      }

      .btn:active {
        background: #1a4db8;
      }

      .footer {
        margin-top: 1.25rem;
        font-size: 0.75rem;
        color: #94a3b8;
      }

      .footer a {
        color: #2e6ef3;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.75"
              d="M9 3H5a2 2 0 00-2 2v4m6-6h10a2 2 0 012 2v4M9 3v18m0 0h10a2 2 0 002-2V9M9 21H5a2 2 0 01-2-2V9m0 0h18"
            />
          </svg>
        </div>
        <span class="brand-name">MyclinicMD</span>
      </div>

      <div class="card">
        <div class="sheet">
          <div class="icon-wrap" aria-hidden="true">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="1.75"
                d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"
              />
            </svg>
          </div>

          <h1>You&apos;re offline</h1>
          <p class="desc">
            MyclinicMD needs a secure connection to load patient data. Check your network, then try again.
          </p>

          <ul class="tips">
            <li>Turn Wi‑Fi or mobile data back on</li>
            <li>Move to an area with better signal</li>
            <li>Patient records stay protected until you reconnect</li>
          </ul>

          <button type="button" class="btn" onclick="window.location.reload()">Try again</button>
        </div>

        <p class="footer">
          Still stuck?
          <a href="mailto:admin@myclinicmd.com?subject=Connection%20issue">admin@myclinicmd.com</a>
        </p>
      </div>
    </div>
  </body>
</html>
